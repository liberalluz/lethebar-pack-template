name: gate

# This file ships with the template. It builds the pack, checks the archive an
# author uploads, and publishes only when a pack tag is pushed. The three steps
# are the same three the engine's guide names.
on:
  push:
    branches: [main]
    tags: ["pack/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: python infra/tool/release/pack.py build packs/example --out dist

      - name: check the archive
        run: python infra/checks/check_pack.py dist/example.zip

      # Publishing is guarded on purpose: a push to main must never create a
      # release. Only a tag shaped pack/<id>/v<version> publishes, and only the
      # pack named in that tag.
      - name: publish
        if: startsWith(github.ref, 'refs/tags/pack/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python infra/tool/release/pack.py hash dist/example.zip
          python infra/tool/release/pack.py publish dist/example.zip \
            --repo "${{ github.repository }}" --tag "${{ github.ref_name }}" --apply
